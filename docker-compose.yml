services:
  postgres:
    image: postgres:16-alpine
    container_name: futcheck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-futcheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-futcheck}
      POSTGRES_DB: ${POSTGRES_DB:-futcheck}
      # Keep the container clock aligned with the business timezone.
      TZ: ${POSTGRES_TZ:-America/Sao_Paulo}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - futcheck-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-futcheck} -d ${POSTGRES_DB:-futcheck}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  futcheck-postgres-data:
    name: futcheck-postgres-data
